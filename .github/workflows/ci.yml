name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # uv reads this; setup-uv v3 has no python-version input.
  UV_PYTHON: "3.13"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    # A hung test should fail quickly, not hold the job for six hours.
    timeout-minutes: 15
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4

      - name: Install dependencies
        run: uv sync --locked

      # Lint once is enough; running it on every OS/Python combo is pure
      # duplication of the same check.
      - name: Lint (ruff check)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: uv run ruff check .

      - name: Format check (ruff format)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: uv run ruff format --check .

      - name: Test
        run: uv run pytest -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4

      - name: Install dependencies
        run: uv sync --locked

      - name: Build sdist and wheel
        run: uv build

      - name: Check sdist contents
        run: uv run python scripts/check_sdist.py dist/*.tar.gz

      - name: Install built wheel into a fresh venv
        run: |
          uv venv /tmp/w
          uv pip install --python /tmp/w dist/*.whl
          /tmp/w/bin/python -c "import iota_hub; print(iota_hub.__version__)"
          # The CLI entry point must import and print help from the installed wheel.
          /tmp/w/bin/iota-hub --help

      - name: Upload dist artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/

  openapi-drift:
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4

      - name: Install dependencies
        run: uv sync --locked

      - name: Check spec/openapi.json against the deployed document
        run: uv run python scripts/check_openapi_drift.py

  smoke:
    runs-on: ubuntu-latest
    # Only on push to main: fork PRs must never get the smoke-test API key.
    if: github.event_name == 'push'
    concurrency:
      group: smoke
      cancel-in-progress: false
    env:
      IOTA_HUB_API_KEY: ${{ secrets.IOTA_HUB_SMOKE_API_KEY }}
      IOTA_HUB_BASE_URL: https://d7gigln4gk.execute-api.us-west-2.amazonaws.com/dev/api
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4

      - name: Install dependencies
        run: uv sync --locked

      - name: Smoke test against dev
        run: uv run pytest -m smoke tests/smoke -q
