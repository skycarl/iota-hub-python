[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "iota-hub"
version = "0.1.0.dev0"
description = "Client library and CLI for the IOTA Hub public API (occultation observation submission)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "IOTA Hub" }]
keywords = ["occultation", "astronomy", "iota", "api-client", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "typer>=0.12",
    "platformdirs>=4",
    # tomllib is stdlib from 3.11; 3.10 needs the backport to read config.toml.
    "tomli>=2; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/skycarl/iota-hub-python"
Documentation = "https://iota-hub.com/developers"
Source = "https://github.com/skycarl/iota-hub-python"

[project.scripts]
iota-hub = "iota_hub.cli:main"

[dependency-groups]
dev = [
    "build>=1.2",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[tool.hatch.build.targets.sdist]
only-include = ["src/iota_hub", "README.md", "LICENSE", "pyproject.toml"]
# hatchling additionally force-includes the repository's .gitignore in every
# sdist (builders/sdist.py: get_default_build_data), and no build setting
# suppresses it - neither `exclude` nor `ignore-vcs`, because forced files skip
# the inclusion rules. It is harmless and standard; the release check allows it.

[tool.hatch.build.targets.wheel]
packages = ["src/iota_hub"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not smoke'"
markers = [
    "smoke: end-to-end tests that talk to a deployed IOTA Hub (skipped by default)",
]
